# Firebase App Hosting configuration for the Citywide Management System (Laravel + PHP).
# Deploys the app as a container on Cloud Run behind Firebase App Hosting.

# Secrets should be created in Google Secret Manager and referenced here.
# Example: firebase apphosting:secrets:set DB_PASSWORD --data-file=...
# or via the Firebase console.

# Replace these with your own values before deploying.
env:
  APP_NAME: "Santa Rosa City"
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: https://your-app.web.app
  LOG_CHANNEL: stderr
  SESSION_DRIVER: cookie
  CACHE_DRIVER: file
  QUEUE_CONNECTION: sync

  # Database — use Cloud SQL (recommended) or any reachable MySQL/MariaDB instance.
  DB_CONNECTION: mysql
  DB_HOST: 127.0.0.1 # change to your Cloud SQL private IP or public host
  DB_PORT: "3306"
  DB_DATABASE: brgy_based
  DB_USERNAME: root
  DB_PASSWORD: "" # move to a secret before going live

# Resource sizing for the container.
# See https://firebase.google.com/docs/app-hosting/configure for more options.
runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80